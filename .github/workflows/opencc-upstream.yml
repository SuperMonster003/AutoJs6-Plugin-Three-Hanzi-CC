name: OpenCC upstream automation

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      controlled_acceptance:
        description: Create the draft-only, non-release M4-D-2/D-3 acceptance fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opencc-upstream-automation
  cancel-in-progress: true

jobs:
  check-release:
    name: Validate release or controlled fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_kind: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_acceptance == true && 'controlled' || 'official' }}
      update_available: ${{ steps.check_official.outputs.update_available || steps.check_controlled.outputs.update_available }}
      locked_version: ${{ steps.check_official.outputs.locked_version || steps.check_controlled.outputs.locked_version }}
      latest_version: ${{ steps.check_official.outputs.latest_version || steps.check_controlled.outputs.latest_version }}
      latest_tag: ${{ steps.check_official.outputs.latest_tag || steps.check_controlled.outputs.latest_tag }}
      latest_commit: ${{ steps.check_official.outputs.latest_commit || steps.check_controlled.outputs.latest_commit }}
      latest_asset: ${{ steps.check_official.outputs.latest_asset || steps.check_controlled.outputs.latest_asset }}
      latest_resource_sha256: ${{ steps.check_official.outputs.latest_resource_sha256 || steps.check_controlled.outputs.latest_resource_sha256 }}

    steps:
      - name: Check out repository without mutable dependencies
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require pr-only policy for controlled acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_acceptance == true
        env:
          OPENCC_AUTOMATION_MODE: ${{ vars.OPENCC_AUTOMATION_MODE || 'pr-only' }}
        run: test "${OPENCC_AUTOMATION_MODE}" = pr-only

      - name: Compare pinned and latest OpenCC releases
        if: github.event_name != 'workflow_dispatch' || inputs.controlled_acceptance != true
        id: check_official
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/opencc/check_upstream.py --root .

      - name: Validate pinned controlled acceptance fixture
        if: github.event_name == 'workflow_dispatch' && inputs.controlled_acceptance == true
        id: check_controlled
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/opencc/controlled_acceptance.py inspect --root .

  prepare-upgrade-pr:
    name: Prepare upgrade PR
    needs: check-release
    if: needs.check-release.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository and pinned OpenCC source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Recheck pr-only policy before controlled writes
        if: needs.check-release.outputs.candidate_kind == 'controlled'
        env:
          OPENCC_AUTOMATION_MODE: ${{ vars.OPENCC_AUTOMATION_MODE || 'pr-only' }}
        run: test "${OPENCC_AUTOMATION_MODE}" = pr-only

      - name: Check for an existing upgrade PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/opencc-${{ needs.check-release.outputs.latest_version }}
        run: |
          number="$(gh pr list --state open --base master --head "${BRANCH_NAME}" --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            url="$(gh pr view "${number}" --json url --jq .url)"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "url=${url}" >> "${GITHUB_OUTPUT}"
            printf 'An OpenCC %s upgrade PR is already open: %s\n' \
              '${{ needs.check-release.outputs.latest_version }}' "${url}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare exact official source, lock, and resource update
        if: steps.existing.outputs.exists != 'true' && needs.check-release.outputs.candidate_kind == 'official'
        id: prepare_official
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/opencc/update_upstream.py
          --root .
          --pr-body-file "${RUNNER_TEMP}/opencc-upgrade-pr.md"

      - name: Prepare exact controlled source, lock, and resource update
        if: steps.existing.outputs.exists != 'true' && needs.check-release.outputs.candidate_kind == 'controlled'
        id: prepare_controlled
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/opencc/controlled_acceptance.py prepare
          --root .
          --pr-body-file "${RUNNER_TEMP}/opencc-upgrade-pr.md"

      - name: Select prepared candidate outputs
        if: steps.existing.outputs.exists != 'true'
        id: prepare
        env:
          OFFICIAL_UPDATE: ${{ steps.prepare_official.outputs.update_available }}
          OFFICIAL_VERSION: ${{ steps.prepare_official.outputs.latest_version }}
          OFFICIAL_TAG: ${{ steps.prepare_official.outputs.latest_tag }}
          OFFICIAL_COMMIT: ${{ steps.prepare_official.outputs.latest_commit }}
          OFFICIAL_DIGEST: ${{ steps.prepare_official.outputs.latest_resource_sha256 }}
          OFFICIAL_BRANCH: ${{ steps.prepare_official.outputs.branch_name }}
          OFFICIAL_TITLE: ${{ steps.prepare_official.outputs.commit_title }}
          CONTROLLED_UPDATE: ${{ steps.prepare_controlled.outputs.update_available }}
          CONTROLLED_VERSION: ${{ steps.prepare_controlled.outputs.latest_version }}
          CONTROLLED_TAG: ${{ steps.prepare_controlled.outputs.latest_tag }}
          CONTROLLED_COMMIT: ${{ steps.prepare_controlled.outputs.latest_commit }}
          CONTROLLED_DIGEST: ${{ steps.prepare_controlled.outputs.latest_resource_sha256 }}
          CONTROLLED_BRANCH: ${{ steps.prepare_controlled.outputs.branch_name }}
          CONTROLLED_TITLE: ${{ steps.prepare_controlled.outputs.commit_title }}
          CANDIDATE_KIND: ${{ needs.check-release.outputs.candidate_kind }}
        run: |
          if [ "${CANDIDATE_KIND}" = controlled ]; then
            prefix=CONTROLLED
          else
            prefix=OFFICIAL
          fi
          for name in UPDATE VERSION TAG COMMIT DIGEST BRANCH TITLE; do
            value="$(printenv "${prefix}_${name}")"
            test -n "${value}"
            output_name="$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]')"
            if [ "${output_name}" = update ]; then
              output_name=update_available
            fi
            printf '%s=%s\n' "${output_name}" "${value}" >> "${GITHUB_OUTPUT}"
          done

      - name: Reject time-of-check/time-of-use release drift
        if: steps.existing.outputs.exists != 'true'
        env:
          CHECKED_VERSION: ${{ needs.check-release.outputs.latest_version }}
          CHECKED_TAG: ${{ needs.check-release.outputs.latest_tag }}
          CHECKED_COMMIT: ${{ needs.check-release.outputs.latest_commit }}
          CHECKED_DIGEST: ${{ needs.check-release.outputs.latest_resource_sha256 }}
          PREPARED_VERSION: ${{ steps.prepare.outputs.latest_version }}
          PREPARED_TAG: ${{ steps.prepare.outputs.latest_tag }}
          PREPARED_COMMIT: ${{ steps.prepare.outputs.latest_commit }}
          PREPARED_DIGEST: ${{ steps.prepare.outputs.latest_resource_sha256 }}
        run: |
          test "${{ steps.prepare.outputs.update_available }}" = true
          test "${CHECKED_VERSION}" = "${PREPARED_VERSION}"
          test "${CHECKED_TAG}" = "${PREPARED_TAG}"
          test "${CHECKED_COMMIT}" = "${PREPARED_COMMIT}"
          test "${CHECKED_DIGEST}" = "${PREPARED_DIGEST}"

      - name: Test updater and verify generated dependency lock
        if: steps.existing.outputs.exists != 'true'
        env:
          CANDIDATE_KIND: ${{ needs.check-release.outputs.candidate_kind }}
        run: |
          python -m unittest discover -s scripts/opencc/tests -p "test_*.py" -v
          if [ "${CANDIDATE_KIND}" = controlled ]; then
            python scripts/opencc/controlled_acceptance.py verify --root .
          else
            python scripts/opencc/verify_upstream.py --root .
          fi
          git diff --check
          git status --short

      - name: Commit and push the automation-owned branch
        if: steps.existing.outputs.exists != 'true'
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          COMMIT_TITLE: ${{ steps.prepare.outputs.commit_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH_NAME}"
          git add -- \
            opencc-upstream.properties \
            opencc-native/src/main/assets/opencc \
            opencc-native/src/main/cpp/third_party/OpenCC
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Validated OpenCC update produced no staged changes."
            exit 1
          fi
          git commit -m "${COMMIT_TITLE}"

          remote_ref="refs/remotes/origin/${BRANCH_NAME}"
          if git fetch --no-tags origin "refs/heads/${BRANCH_NAME}:${remote_ref}" 2>/dev/null; then
            lease="$(git rev-parse "${remote_ref}")"
            git push \
              --force-with-lease="refs/heads/${BRANCH_NAME}:${lease}" \
              origin "HEAD:refs/heads/${BRANCH_NAME}"
          else
            git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          fi

      - name: Dispatch mandatory build and documentation gates
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          CANDIDATE_KIND: ${{ needs.check-release.outputs.candidate_kind }}
        run: |
          if [ "${CANDIDATE_KIND}" = controlled ]; then
            gh workflow run build.yml --ref "${BRANCH_NAME}" -f controlled_opencc_acceptance=true
          else
            gh workflow run build.yml --ref "${BRANCH_NAME}"
          fi
          gh workflow run markdown.yml --ref "${BRANCH_NAME}"
          printf 'Dispatched %s Build integrity and Markdown integrity for `%s`.\n' \
            "${CANDIDATE_KIND}" "${BRANCH_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create the upstream upgrade pull request
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          PR_TITLE: ${{ steps.prepare.outputs.commit_title }}
          CANDIDATE_KIND: ${{ needs.check-release.outputs.candidate_kind }}
        run: |
          pr_args=(
            --base master
            --head "${BRANCH_NAME}"
            --title "${PR_TITLE}"
            --body-file "${RUNNER_TEMP}/opencc-upgrade-pr.md"
          )
          if [ "${CANDIDATE_KIND}" = controlled ]; then
            pr_args+=(--draft)
          fi
          if ! pr_url="$(gh pr create "${pr_args[@]}")"; then
            echo "::error::Unable to create the upgrade PR. In Settings > Actions > General, enable 'Allow GitHub Actions to create and approve pull requests', then rerun this workflow. The workflow never submits an approval."
            exit 1
          fi
          printf 'Created %s upstream upgrade PR in the current pr-only phase: %s\n' \
            "${CANDIDATE_KIND}" "${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'This preparation workflow does not approve, merge, tag, or release; later stages use separate fail-closed controllers.\n' \
            >> "${GITHUB_STEP_SUMMARY}"
