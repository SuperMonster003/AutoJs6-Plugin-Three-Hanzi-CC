name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test Python tooling
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_*.py"
          python -m unittest discover -s scripts/release/tests -p "test_*.py"
          python -m unittest discover -s scripts/opencc/tests -p "test_*.py"
          python -m unittest discover -s scripts/benchmark/tests -p "test_*.py"

      - name: Verify pinned OpenCC source and resources
        run: python scripts/opencc/verify_upstream.py --root .

      - name: Run unit tests and assemble debug/release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace

      - name: Assemble platform-only release probe APK
        run: |
          ./gradlew :app:assembleDebugAndroidTest -PopenccReleaseProbe=true --stacktrace
          mkdir -p app/build/outputs/apk/releaseProbe
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            app/build/outputs/apk/releaseProbe/app-release-probe-androidTest.apk
          ./gradlew :app:assembleDebugAndroidTest -PopenccReleaseProbe=false --stacktrace

      - name: Verify all ABI variants
        run: |
          python scripts/ci/verify_apk_variants.py \
            app/build/outputs/apk/debug \
            --instrumentation-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          python scripts/ci/verify_apk_variants.py \
            app/build/outputs/apk/release \
            --build-type release \
            --unsigned \
            --instrumentation-apk \
              app/build/outputs/apk/releaseProbe/app-release-probe-androidTest.apk

      - name: Upload debug, release, and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: build-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-service:
    name: Binder round trip (${{ matrix.abi }})
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug and test APKs
        uses: actions/download-artifact@v8
        with:
          name: build-test-apks
          path: ci-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify discovery and Binder conversions
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: EXPECTED_PAGE_SIZE=4096 sh scripts/ci/verify_binder_round_trip.sh "${{ matrix.abi }}"

  verify-min-sdk:
    name: Debug/release runtime (x86, API 24 minSdk)
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug and test APKs
        uses: actions/download-artifact@v8
        with:
          name: build-test-apks
          path: ci-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify standalone UI and plugin contract at minSdk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86
          profile: Nexus 5
          script: |
            EXPECTED_PAGE_SIZE=4096 sh scripts/ci/verify_binder_round_trip.sh x86
            EXPECTED_VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)" \
            EXPECTED_VERSION_CODE="$(sed -n 's/^VERSION_BUILD=//p' version.properties)" \
            EXPECTED_PAGE_SIZE=4096 \
            sh scripts/ci/verify_minified_release_runtime.sh x86

  verify-16kb:
    name: Binder round trip (x86_64, 16 KB pages)
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug and test APKs
        uses: actions/download-artifact@v8
        with:
          name: build-test-apks
          path: ci-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify discovery and Binder conversions on 16 KB pages
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_7
          # The 16 KB Google APIs image breached its guest LMK watermark twice at the
          # profile default of 2560 MB while a 156-183 MB foreground test process ran.
          ram-size: 4096M
          script: EXPECTED_PAGE_SIZE=16384 sh scripts/ci/verify_binder_round_trip.sh x86_64
